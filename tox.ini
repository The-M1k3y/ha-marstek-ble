[tox]
env_list = py311, py312, py313, py314
skipsdist = true
skip_missing_interpreters = true

[testenv]
description = Run the isolated passing baseline on a supported Python interpreter
deps = -r requirements-test.txt
commands = python -m pytest -m "not known_issue"

[testenv:ha]
description = Run isolated tests against the genuine Home Assistant framework
base_python = python3.14
deps = -r requirements-test-ha.txt
commands = python -m pytest -c pytest-ha.ini
